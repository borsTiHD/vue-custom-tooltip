name: Release and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

env:
  NODE_VERSION: 24.16.0

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:unit run

  build:
    name: Build Library
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm run build

  version-and-release:
    name: Version Bump and Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: "npm version ${{ github.event.inputs.version }} -m 'chore: release v%s' --no-git-tag-version"

      - name: Update changelog
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          node scripts/update-changelog.js $NEW_VERSION

      - name: Commit and push changes
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add CHANGELOG.md package.json
          git commit -m "chore: release v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push
          git push --tags

      - name: Get version
        id: get-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: version-and-release
    permissions:
      contents: read
      id-token: write
    # setup-node v7 dropped its dummy NODE_AUTH_TOKEN, so .npmrc must resolve it from `pnpm install` on.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version-and-release.outputs.version }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # `prepublishOnly` runs the tests and builds dist/ before packing.
      - name: Publish to NPM
        run: npm publish --provenance --access public

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version-and-release, publish]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version-and-release.outputs.version }}

      - name: Create GitHub Release
        uses: actions/github-script@v8
        with:
          script: |
            const version = '${{ needs.version-and-release.outputs.version }}';

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `Release v${version}`,
              generate_release_notes: true
            });
